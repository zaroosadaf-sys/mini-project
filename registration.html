 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Registration Portal</title>
<link rel="stylesheet" href="registration.css">
</head>

<body>

<header>

<h1>College Registration Portal</h1>

<nav>
<a href="#">Home</a>
<a href="#">Registration</a>
</nav>

</header>

<section class="home">

<h2>Welcome to Our College</h2>

<p>
Complete your registration form below.
Fill all the required information carefully.
</p>

</section>

<section class="container">

<h2>Student Registration Form</h2>

<form id="registrationForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Father Name</label>
<input type="text" id="father" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="tel" id="phone" required>

<label>Gender</label>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<label>Date of Birth</label>

<input type="date" id="dob">

<label>Course</label>

<select id="course">

<option>Information Technology</option>

<option>Computer Engineering</option>

<option>Civil Engineering</option>

<option>Mechanical Engineering</option>

</select>

<label>Address</label>

<textarea id="address"></textarea>

<input type="submit" value="Submit">

</form>

</section>

<section class="output">

<h2>Submitted Information</h2>

<div id="result">

<p>No Record Submitted</p>

</div>

</section>

<script src="registration.js"></script>

</body>
</html>
