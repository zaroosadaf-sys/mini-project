<!DOCTYPE html>
<html>

<head>
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<div class="card" style="width: 18rem;">
  <img src="..." class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">Card title</h5>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
    <a href="#" class="btn btn-primary">Go somewhere</a>
  </div>
</div>
</head>

<body>
    <div class="container">

        <h1>My Website</h1>

        <h2>Create Account</h2>

        <form onsubmit="return validateForm()">

            <input type="text" id="name" placeholder=" Full Name"><br><br>

            <input type="email" id="email" placeholder=" Email Address"><br><br>

            <input type="number" id="phone" placeholder=" Phone Number"><br><br>

            <input type="password" id="password" placeholder=" Password">
            <br><br>

            <input type="password" id="confirm" placeholder=" Confirm Password"><br><br>

            <input type="checkbox" id="terms">
            I agree to the Terms & Conditions
            <br><br>

            <button type="submit">Sign Up</button>

        </form>

        <p>Already have an account?
            <a href="#">Login</a>
        </p>

        <hr>

        <button type="button">Continue with Google</button>
        <br><br>

        <button type="button">Continue with Facebook</button>
        <br><br>

        <button type="button">Continue with Apple</button>

    </div>

    <script src="signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>u
</body>

</html>
