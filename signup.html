<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="sign up.css">
</head>
<body>

<div class="container">

    <div class="logo">My Website</div>

    <h2>Create Account</h2>

    <form onsubmit="return validateForm()">

        <input type="text" id="name" placeholder="Full Name"><br>

        <input type="email" id="email" placeholder="Email Address"><br>

        <input type="number" id="phone" placeholder="Phone Number"><br>

        <div class="password">
            <input type="password" id="password" placeholder="Password">
            <button type="button" onclick="showPassword()">Show/Hide</button>
        </div>

        <div class="password">
            <input type="password" id="confirm" placeholder="Confirm Password">
        </div>

        <div class="checkbox">
            <input type="checkbox" id="terms">
            I agree to the Terms & Conditions
        </div>

        <button type="submit">Sign Up</button>

    </form>

    <p>
        Already have an account?
        <a href="#">Login</a>
    </p>

    <div class="social">
        <button type="button">Continue with Google</button><br><br>
        <button type="button">Continue with Facebook</button><br><br>
        <button type="button">Continue with Apple</button>
    </div>

</div>

<script src="signup.js"></script>

</body>
</html>
